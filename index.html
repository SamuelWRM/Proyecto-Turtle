<!doctype html>
<!--HOLA GITHUBAAAAAA-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto NVR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
    <style>
      :root {
        --bg: #212529;
        --surface: #2c3034;
        --border: #373b3e;
        --text: #dee2e6;
        --muted: #6c757d;
        --accent: #0dcaf0;
        --white: #f8f9fa;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--white);
      }

      nav {
        display: flex;
        gap: 8px;
      }

      .nav-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.875rem;
        padding: 6px 14px;
        border-radius: 4px;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .nav-link:hover {
        background: var(--border);
        color: var(--white);
      }
      .nav-link.active {
        color: var(--white);
      }

      .main-layout {
        display: flex;
        flex: 1;
        gap: 12px;
        padding: 12px;
      }

      .primary-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .primary-label {
        font-size: 0.75rem;
        color: var(--accent);
        letter-spacing: 0.5px;
      }

      #primaryVideo {
        width: 1150px;
        height: 448px;
        flex: 1;
        background: #000;
        border-radius: 6px;
        border: 1px solid var(--border);
        min-height: 480px;
        display: block;
      }

      .side-col {
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }

      .cam-box {
        background: #000;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
        position: relative;
        cursor: pointer;
        transition: border-color 0.2s;
        flex-shrink: 0;
      }

      .cam-box:hover {
        border-color: var(--accent);
      }
      .cam-box.active {
        border-color: var(--accent);
      }

      .cam-label {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.65);
        color: var(--accent);
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 3px;
        letter-spacing: 0.5px;
        z-index: 10;
        pointer-events: none;
      }

      .secondary-video {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
        background: #000;
      }

      .cam-box::after {
        content: "Ver en principal";
        position: absolute;
        inset: 0;
        background: rgba(13, 202, 240, 0.15);
        color: var(--accent);
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .cam-box:hover::after {
        opacity: 1;
      }
      .cam-box.active::after {
        content: none;
      }

      footer {
        border-top: 1px solid var(--border);
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        flex-shrink: 0;
      }

      .footer-text {
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* ══════════════════════════════════════════
         DISEÑO RESPONSIVO PARA MÓVIL
         Solo aplica en pantallas de 768px o menos.
         El diseño de escritorio de arriba no se toca.
      ══════════════════════════════════════════ */
      @media (max-width: 768px) {
        /* Ocultamos el video principal y su label,
           en móvil solo se ven las 6 cámaras en columna */
        .primary-col {
          display: none;
        }

        .main-layout {
          flex-direction: column;
          padding: 8px;
          gap: 8px;
        }

        /* El panel ocupa todo el ancho de la pantalla */
        .side-col {
          width: 100%;
          overflow-y: visible;
        }

        /* Cada cámara ocupa todo el ancho */
        .cam-box {
          width: 100%;
        }

        /* Los videos son más altos porque son la única vista */
        .secondary-video {
          height: 210px;
        }

        /* Sin overlay en móvil porque no hay reproductor principal */
        .cam-box::after {
          content: none;
        }

        header {
          padding: 10px 14px;
        }

        header h1 {
          font-size: 1.1rem;
        }

        .nav-link {
          font-size: 0.78rem;
          padding: 5px 10px;
        }

        footer {
          flex-direction: column;
          gap: 4px;
          text-align: center;
          padding: 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Proyecto NVR</h1>
      <nav>
        <a href="index.html" class="nav-link active">En Vivo</a>
        <a href="select_grab.html" class="nav-link">Grabaciones</a>
      </nav>
    </header>

    <div class="main-layout">
      <div class="primary-col">
        <span class="primary-label" id="primaryLabel">CAM 6 — PRINCIPAL</span>
        <video id="primaryVideo" muted autoplay playsinline></video>
      </div>
      <div class="side-col" id="sideCol"></div>
    </div>

    <footer>
      <span class="footer-text"
        >>© 2026 UAT RODHE | Ingenieria en Sistemas Computacionales 4 "J"</span
      >
      <span class="footer-text" id="reloj"></span>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
