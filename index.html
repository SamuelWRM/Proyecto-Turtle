<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto NVR</title>
    <!-- HLS.js: librería que permite reproducir streams HLS en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
    <style>
      :root {
        --bg: #212529;
        --surface: #2c3034;
        --border: #373b3e;
        --text: #dee2e6;
        --muted: #6c757d;
        --accent: #0dcaf0;
        --white: #f8f9fa;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── HEADER ── */
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--white);
      }

      nav {
        display: flex;
        gap: 8px;
      }

      .nav-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.875rem;
        padding: 6px 14px;
        border-radius: 4px;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .nav-link:hover {
        background: var(--border);
        color: var(--white);
      }
      .nav-link.active {
        color: var(--white);
      }

      /* ── LAYOUT PRINCIPAL ── */
      .main-layout {
        display: flex;
        flex: 1;
        gap: 12px;
        padding: 12px;
      }

      .primary-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .primary-label {
        font-size: 0.75rem;
        color: var(--accent);
        letter-spacing: 0.5px;
      }
      /*
      Video principal. Usamos <video> en lugar de <img> porque
      HLS.js necesita la API de video del navegador para alimentarle
      los fragmentos .ts. Con MJPEG alcanzaba con <img>, pero HLS
      es más sofisticado y requiere el elemento correcto.
    */
      #primaryVideo {
        width: 1150px;
        height: 448px;
        flex: 1;
        background: #000;
        border-radius: 6px;
        border: 1px solid var(--border);
        min-height: 480px;
        display: block;
      }

      /* Panel lateral */
      .side-col {
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }

      /* Caja de cada cámara secundaria */
      .cam-box {
        background: #000;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
        position: relative;
        cursor: pointer;
        transition: border-color 0.2s;
        flex-shrink: 0;
      }

      .cam-box:hover {
        border-color: var(--accent);
      }

      /* Marca visualmente cuál cámara es la que está en el principal */
      .cam-box.active {
        border-color: var(--accent);
      }

      .cam-label {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.65);
        color: var(--accent);
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 3px;
        letter-spacing: 0.5px;
        z-index: 10;
        pointer-events: none;
      }

      /*
      Videos secundarios sin controles, silenciados y en autoplay.
      muted + autoplay es el par mágico que los navegadores modernos
      requieren para reproducir video automáticamente sin que el usuario
      haya interactuado primero con la página.
    */
      .secondary-video {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
        background: #000;
      }

      /* Overlay "Ver en principal" que aparece al hacer hover */
      .cam-box::after {
        content: "Ver en principal";
        position: absolute;
        inset: 0;
        background: rgba(13, 202, 240, 0.15);
        color: var(--accent);
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .cam-box:hover::after {
        opacity: 1;
      }
      /* La cámara activa no necesita el overlay porque ya está en principal */
      .cam-box.active::after {
        content: none;
      }

      /* ── FOOTER ── */
      footer {
        border-top: 1px solid var(--border);
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface);
        flex-shrink: 0;
      }

      .footer-text {
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Proyecto NVR</h1>
      <nav>
        <a href="index.html" class="nav-link active">En Vivo</a>
        <a href="select_grab.html" class="nav-link">Grabaciones</a>
      </nav>
    </header>

    <div class="main-layout">
      <!-- Cámara principal: arranca mostrando la cámara 6 por defecto -->
      <div class="primary-col">
        <span class="primary-label" id="primaryLabel">CAM 6 — PRINCIPAL</span>
        <video id="primaryVideo" muted autoplay playsinline></video>
      </div>

      <!-- Panel lateral: las 6 cajas se generan con JavaScript -->
      <div class="side-col" id="sideCol"></div>
    </div>

    <footer>
      <span class="footer-text"
        >>© 2026 UAT RODHE | Ingenieria en Sistemas Computacionales 4 "J"</span
      >
      <span class="footer-text" id="reloj"></span>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
